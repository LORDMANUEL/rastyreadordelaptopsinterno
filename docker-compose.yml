services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - assetguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ALLOW_LEGACY_ENROLLMENT_TOKEN: ${ALLOW_LEGACY_ENROLLMENT_TOKEN:-false}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      HEARTBEAT_OFFLINE_SECONDS: ${HEARTBEAT_OFFLINE_SECONDS:-600}
      DEVICE_AUTH_ROTATE_DAYS: ${DEVICE_AUTH_ROTATE_DAYS:-7}
      DEVICE_AUTH_TTL_DAYS: ${DEVICE_AUTH_TTL_DAYS:-45}
      NETWORK_GEO_REQUIRED: ${NETWORK_GEO_REQUIRED:-false}
      GEOIP_CITY_DB: ${GEOIP_CITY_DB:-/geoip/GeoLite2-City.mmdb}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      ENROLL_RATE_LIMIT: ${ENROLL_RATE_LIMIT:-30}
      ENROLL_RATE_WINDOW_SECONDS: ${ENROLL_RATE_WINDOW_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./geoip:/geoip:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ops:/ops:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          sh /ops/backup-postgres.sh
          sleep "${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  assetguard_pgdata:
