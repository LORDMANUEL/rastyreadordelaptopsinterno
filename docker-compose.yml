services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - assetguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ALLOW_LEGACY_ENROLLMENT_TOKEN: ${ALLOW_LEGACY_ENROLLMENT_TOKEN:-false}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      HEARTBEAT_OFFLINE_SECONDS: ${HEARTBEAT_OFFLINE_SECONDS:-600}
      DEVICE_AUTH_ROTATE_DAYS: ${DEVICE_AUTH_ROTATE_DAYS:-7}
      DEVICE_AUTH_TTL_DAYS: ${DEVICE_AUTH_TTL_DAYS:-45}
      NETWORK_GEO_REQUIRED: ${NETWORK_GEO_REQUIRED:-false}
      GEOIP_CITY_DB: ${GEOIP_CITY_DB:-/geoip/GeoLite2-City.mmdb}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./geoip:/geoip:ro
    ports:
      - "8000:8000"

volumes:
  assetguard_pgdata:
