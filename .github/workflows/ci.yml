name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: pip install -r server/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q server/app

  windows-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format check
        working-directory: agent-go
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: agent-go
        run: go vet ./...
      - name: Build Windows agent
        working-directory: agent-go
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o YudeAssetGuard.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: YudeAssetGuard-windows-amd64
          path: agent-go/YudeAssetGuard.exe
