name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ops scripts and Compose
        env:
          POSTGRES_DB: ci_assetguard
          POSTGRES_USER: ci_assetguard
          POSTGRES_PASSWORD: ci-db-value
          DATABASE_URL: postgresql+psycopg://ci_assetguard:ci-db-value@db:5432/ci_assetguard
          ADMIN_TOKEN: ci-admin-value
          SESSION_SECRET: ci-session-value
        run: |
          sh -n ops/backup-postgres.sh
          sh -n ops/restore-postgres.sh
          docker compose config >/dev/null
      - name: Build and inspect hardened API image
        run: |
          docker build -t yude-asset-guard-ci ./server
          test "$(docker image inspect yude-asset-guard-ci --format '{{.Config.User}}')" = "assetguard"
          test -n "$(docker image inspect yude-asset-guard-ci --format '{{json .Config.Healthcheck}}')"
      - name: Compose smoke test
        env:
          POSTGRES_DB: ci_assetguard
          POSTGRES_USER: ci_assetguard
          POSTGRES_PASSWORD: ci-db-value
          DATABASE_URL: postgresql+psycopg://ci_assetguard:ci-db-value@db:5432/ci_assetguard
          ADMIN_TOKEN: ci-admin-value
          SESSION_SECRET: ci-session-value
          API_BIND_ADDRESS: 127.0.0.1
          API_PORT: 18000
          BACKUP_HOST_DIR: ./backups-ci
        run: |
          rm -rf backups-ci
          mkdir -p backups-ci
          docker compose up -d --build db api backup
          cleanup() {
            docker compose down -v --remove-orphans
            rm -rf backups-ci
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/ready >/tmp/ready.json; then
              break
            fi
            sleep 2
          done

          test -s /tmp/ready.json
          grep -q '"database":"ok"' /tmp/ready.json

          docker compose exec -T backup sh /ops/backup-postgres.sh
          test "$(find backups-ci -maxdepth 1 -name '*.dump' | wc -l)" -ge 1
          test "$(find backups-ci -maxdepth 1 -name '*.dump.sha256' | wc -l)" -ge 1

          dump="$(find backups-ci -maxdepth 1 -name '*.dump' | head -n 1)"
          test -n "$dump"
          base="$(basename "$dump")"
          (cd backups-ci && sha256sum -c "$base.sha256")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: pip install -r server/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q server/app
      - name: Run database migrations
        working-directory: server
        env:
          ALLOW_LEGACY_ENROLLMENT_TOKEN: "true"
          ENROLLMENT_TOKEN: ci-enrollment-token
          ADMIN_TOKEN: ci-admin-token
          DATABASE_URL: sqlite:////tmp/yude_asset_guard_ci.db
        run: python -m app.migrate
      - name: Import application
        working-directory: server
        env:
          ALLOW_LEGACY_ENROLLMENT_TOKEN: "true"
          ENROLLMENT_TOKEN: ci-enrollment-token
          ADMIN_TOKEN: ci-admin-token
          DATABASE_URL: sqlite:////tmp/yude_asset_guard_ci.db
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from app.database import engine
          from app.main import app, validate_configuration
          validate_configuration()
          inspector = inspect(engine)
          cols = {c["name"] for c in inspector.get_columns("devices")}
          required = {
              "wifi_ssid",
              "hardware_uuid",
              "bitlocker_status",
              "tpm_status",
              "antivirus_status",
              "geo_country_code",
              "geo_region_name",
              "geo_city_name",
              "geo_accuracy_km",
              "offline_since",
          }
          assert required.issubset(cols), cols
          tables = inspector.get_table_names()
          assert "device_observations" in tables
          assert "user_accounts" in tables
          assert "installed_applications" in tables
          assert "enrollment_codes" in tables
          assert "software_catalog" in tables
          assert "device_software_assignments" in tables
          assert "device_software_tasks" in tables
          catalog_cols = {c["name"] for c in inspector.get_columns("software_catalog")}
          assert {"package_url", "package_sha256", "product_code"}.issubset(catalog_cols)
          task_cols = {c["name"] for c in inspector.get_columns("device_software_tasks")}
          assert "lease_expires_at" in task_cols
          assert app.title == "YUDE Asset Guard"
          print("FastAPI + migrations OK")
          PY
      - name: Run API tests
        working-directory: server
        env:
          ALLOW_LEGACY_ENROLLMENT_TOKEN: "true"
          ENROLLMENT_TOKEN: ci-enrollment-token
          ADMIN_TOKEN: ci-admin-token
          DATABASE_URL: sqlite:////tmp/yude_asset_guard_ci.db
        run: pytest -q

  windows-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent-go/go.mod
      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content agent-go/install.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content agent-go/uninstall.ps1 -Raw)) | Out-Null
      - name: Resolve Go modules for all platforms
        working-directory: agent-go
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Go formatting
        working-directory: agent-go
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            echo "$files"
            exit 1
          fi
      - name: Run Go unit tests
        working-directory: agent-go
        run: go test ./...
      - name: Vet Linux build
        working-directory: agent-go
        run: go vet ./...
      - name: Vet Windows build
        working-directory: agent-go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: Build Windows agent
        working-directory: agent-go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o YudeAssetGuard.exe .
      - name: Package Windows deployment kit
        run: |
          mkdir -p dist/windows-amd64
          cp agent-go/YudeAssetGuard.exe dist/windows-amd64/
          cp agent-go/install.ps1 dist/windows-amd64/
          cp agent-go/uninstall.ps1 dist/windows-amd64/
          cp agent-go/config.example.json dist/windows-amd64/
          sha256sum dist/windows-amd64/YudeAssetGuard.exe > dist/windows-amd64/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YudeAssetGuard-windows-amd64
          path: dist/windows-amd64/

  windows-service-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent-go/go.mod
      - name: Build native Windows agent
        working-directory: agent-go
        shell: pwsh
        run: go build -trimpath -o YudeAssetGuard.exe .
      - name: Exercise Windows service lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $programDataDir = Join-Path $env:ProgramData "YUDEAssetGuard"
          New-Item -ItemType Directory -Force -Path $programDataDir | Out-Null

          $config = @{
            server_url = "https://127.0.0.1:65535"
            device_id = "ci-device"
            device_token = "ci-device-token"
            heartbeat_seconds = 30
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $programDataDir "config.json") -Value $config -Encoding UTF8

          $exe = (Resolve-Path "agent-go\YudeAssetGuard.exe").Path

          try {
            & $exe install
            if ($LASTEXITCODE -ne 0) { throw "service install failed" }

            & sc.exe failure YudeAssetGuard reset= 86400 actions= restart/60000/restart/60000/none/0 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "service recovery configuration failed" }

            & $exe start
            if ($LASTEXITCODE -ne 0) { throw "service start failed" }

            $service = Get-Service -Name "YudeAssetGuard"
            $service.WaitForStatus("Running", [TimeSpan]::FromSeconds(20))

            Start-Sleep -Seconds 3
            $service.Refresh()
            if ($service.Status -ne "Running") {
              throw "service did not remain running"
            }

            $logPath = Join-Path $programDataDir "agent.log"
            for ($i = 0; $i -lt 10 -and -not (Test-Path $logPath); $i++) {
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $logPath)) {
              throw "persistent agent log was not created"
            }

            & $exe stop
            if ($LASTEXITCODE -ne 0) { throw "service stop failed" }

            & $exe uninstall
            if ($LASTEXITCODE -ne 0) { throw "service uninstall failed" }

            for ($i = 0; $i -lt 20; $i++) {
              if (-not (Get-Service -Name "YudeAssetGuard" -ErrorAction SilentlyContinue)) {
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (Get-Service -Name "YudeAssetGuard" -ErrorAction SilentlyContinue) {
              throw "service still exists after uninstall"
            }
          }
          finally {
            sc.exe stop YudeAssetGuard 2>$null | Out-Null
            sc.exe delete YudeAssetGuard 2>$null | Out-Null
            Remove-Item $programDataDir -Recurse -Force -ErrorAction SilentlyContinue
          }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p android-mdm :app:assembleDebug --stacktrace
      - name: Create APK checksum
        run: sha256sum android-mdm/app/build/outputs/apk/debug/app-debug.apk > android-mdm/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YUDE-Asset-Guard-Android-debug
          path: |
            android-mdm/app/build/outputs/apk/debug/app-debug.apk
            android-mdm/app/build/outputs/apk/debug/SHA256SUMS.txt
