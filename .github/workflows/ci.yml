name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: pip install -r server/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q server/app
      - name: Import application
        env:
          ENROLLMENT_TOKEN: ci-enrollment-token
          ADMIN_TOKEN: ci-admin-token
          DATABASE_URL: sqlite:////tmp/yude_asset_guard_ci.db
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "server")
          from app.main import app, startup
          startup()
          assert app.title == "YUDE Asset Guard"
          print("FastAPI startup OK")
          PY

  windows-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent-go/go.sum
      - name: Resolve Go modules for all platforms
        working-directory: agent-go
        run: go mod tidy
      - name: Format sources
        working-directory: agent-go
        run: gofmt -w .
      - name: Vet Linux build
        working-directory: agent-go
        run: go vet ./...
      - name: Build Windows agent
        working-directory: agent-go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o YudeAssetGuard.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: YudeAssetGuard-windows-amd64
          path: agent-go/YudeAssetGuard.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p android-mdm :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YUDE-Asset-Guard-Android-debug
          path: android-mdm/app/build/outputs/apk/debug/app-debug.apk
